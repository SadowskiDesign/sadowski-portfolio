<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 397 403" width="397" height="403"
     role="img" aria-labelledby="t">
  <title id="t">The legacy transfer flow, in four steps.</title>
  <style>
    .n    { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; fill: #1E1BA8; }
    .t    { font-family: Georgia, 'Times New Roman', serif; font-size: 19px; fill: #17130F; }
    .w    { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #6E6459; }
    .note { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; fill: #17130F; }
  </style>
  <line x1="46" y1="33" x2="46" y2="334" stroke="#D8D0C4" stroke-width="1"/>
  <circle cx="46" cy="33" r="4.5" fill="#1E1BA8"/>
  <text class="n" x="0" y="40">01</text>
  <text class="t" x="74" y="40">Navigates to view RECs</text>
  <text class="w" x="74" y="64">Certificates</text>
  <text class="note" x="74" y="88">View-only table. No actions allowed here.</text>
  <circle cx="46" cy="127" r="4.5" fill="#1E1BA8"/>
  <text class="n" x="0" y="134">02</text>
  <text class="t" x="74" y="134">Decides to transfer</text>
  <text class="w" x="74" y="158">Clicks Transfer in top navigation</text>
  <text class="note" x="74" y="182">User must manually switch contexts.</text>
  <circle cx="46" cy="221" r="4.5" fill="#1E1BA8"/>
  <text class="n" x="0" y="228">03</text>
  <text class="t" x="74" y="228">Opens batch transfer setup</text>
  <text class="w" x="74" y="252">Transfer &gt; Initiate Batch Transfer</text>
  <text class="note" x="74" y="276">Enters interactive table: selects rows and</text>
  <text class="note" x="74" y="295">quantity, no filtering.</text>
  <circle cx="46" cy="334" r="4.5" fill="#1E1BA8"/>
  <text class="n" x="0" y="341">04</text>
  <text class="t" x="74" y="341">Submits batch transfer</text>
  <text class="w" x="74" y="365">Confirmation via Submit button</text>
  <text class="note" x="74" y="389">No system feedback on this action.</text>
</svg>
