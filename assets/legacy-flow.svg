<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 240" width="1060" height="240"
     role="img" aria-labelledby="flowTitle">
  <title id="flowTitle">The legacy transfer flow: four steps, from viewing RECs to submitting a batch transfer.</title>
  <style>
    .t { font-family: Georgia, 'Times New Roman', serif; font-size: 19px; fill: #17130F; }
    .w { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #17130F; }
    .n { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; fill: #6E6459; }
    .d { font-family: Georgia, 'Times New Roman', serif; font-size: 17px; fill: #1E1BA8; }
  </style>
  <g>
    <circle cx="19" cy="24" r="19" fill="none" stroke="#1E1BA8" stroke-width="2"/>
    <text class="d" x="19" y="30" text-anchor="middle">1</text>
    <rect x="48" y="22" width="197" height="4" rx="2" fill="#1E1BA8"/>
    <text class="t" x="0" y="80">Navigates to view RECs</text>
    <text class="w" x="0" y="134">Certificates</text>
    <text class="n" x="0" y="176">View-only table. No actions</text>
    <text class="n" x="0" y="196">allowed here.</text>
  </g>
  <g>
    <circle cx="284" cy="24" r="19" fill="none" stroke="#1E1BA8" stroke-width="2"/>
    <text class="d" x="284" y="30" text-anchor="middle">2</text>
    <rect x="313" y="22" width="197" height="4" rx="2" fill="#1E1BA8"/>
    <text class="t" x="265" y="80">Decides to transfer</text>
    <text class="w" x="265" y="134">Clicks Transfer in top</text>
    <text class="w" x="265" y="152">navigation</text>
    <text class="n" x="265" y="176">User must manually switch</text>
    <text class="n" x="265" y="196">contexts.</text>
  </g>
  <g>
    <circle cx="549" cy="24" r="19" fill="none" stroke="#1E1BA8" stroke-width="2"/>
    <text class="d" x="549" y="30" text-anchor="middle">3</text>
    <rect x="578" y="22" width="197" height="4" rx="2" fill="#1E1BA8"/>
    <text class="t" x="530" y="80">Opens batch transfer</text>
    <text class="t" x="530" y="104">setup</text>
    <text class="w" x="530" y="134">Transfer &gt; Initiate Batch</text>
    <text class="w" x="530" y="152">Transfer</text>
    <text class="n" x="530" y="176">Enters interactive table:</text>
    <text class="n" x="530" y="196">selects rows and quantity,</text>
    <text class="n" x="530" y="216">no filtering.</text>
  </g>
  <g>
    <circle cx="814" cy="24" r="19" fill="none" stroke="#1E1BA8" stroke-width="2"/>
    <text class="d" x="814" y="30" text-anchor="middle">4</text>
    <text class="t" x="795" y="80">Submits batch transfer</text>
    <text class="w" x="795" y="134">Confirmation via Submit</text>
    <text class="w" x="795" y="152">button</text>
    <text class="n" x="795" y="176">No system feedback on this</text>
    <text class="n" x="795" y="196">action.</text>
  </g>
</svg>
